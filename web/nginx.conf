server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoint de healthcheck para Docker Compose
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Proxy reverso para Server-Sent Events (/api/stream) sin buffering
    location /api/stream {
        proxy_pass http://api:8000/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Proxy reverso hacia FastAPI (/api y /auth)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /auth/ {
        proxy_pass http://api:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Soporte SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }
}

